[project]
name = "debate-it-out"
version = "0.1.0"
description = "DebateItOut — multi-model AI debate orchestrator"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20.0",
    "fastapi>=0.137.1",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.49.0",
    "typer>=0.12.3",
]

[project.scripts]
debate = "cli:app"
debateitout = "cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli", "db", "handlers", "main", "moderator"]
packages = ["prompts"]
