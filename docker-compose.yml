services:
  db:
    image: postgres:16-alpine
    container_name: promptcouncil-db
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: promptcouncil-backend
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      PORT: "3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./frontend:/frontend:ro

volumes:
  postgres_data:
