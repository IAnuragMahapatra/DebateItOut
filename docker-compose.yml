services:
  db:
    image: postgres:16-alpine
    container_name: debateitout-db
    environment:
      POSTGRES_USER: debateitout
      POSTGRES_PASSWORD: debateitout
      POSTGRES_DB: debateitout
    ports:
      - "5432:5432"
    volumes:
      - debateitout_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debateitout -d debateitout"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: debateitout-backend
    ports:
      - "${PORT:-3002}:3002"
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      PORT: "3002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./frontend:/frontend:ro

volumes:
  debateitout_data:
