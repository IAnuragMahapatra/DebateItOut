<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F5F0E8" />
  <title>DebateItOut</title>
  <meta name="description" content="DebateItOut — self-hosted multi-model AI debate engine. Watch Claude, GPT, Gemini and local models argue both sides of any proposition." />
  <meta property="og:title" content="DebateItOut" />
  <meta property="og:description" content="Multi-model AI debate orchestrator with faction-level context isolation." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='4' y='8' width='18' height='32' rx='4' fill='none' stroke='%23C8BFA8' stroke-width='2'/%3E%3Crect x='26' y='8' width='18' height='32' rx='4' fill='none' stroke='%23C8BFA8' stroke-width='2'/%3E%3Cline x1='24' y1='8' x2='24' y2='40' stroke='%23C8BFA8' stroke-width='1.5' stroke-dasharray='4 3'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Lora:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked@13/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div id="app">
    <div class="app-layout">

      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-inner">
          <div class="sidebar-header">
            <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle sidebar" aria-label="Toggle sidebar">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="3"/>
                <line x1="9" y1="3" x2="9" y2="21"/>
              </svg>
            </button>
            <span class="sidebar-title">Debates</span>
            <button class="new-debate-btn" id="new-debate-btn" title="New debate (Ctrl+N)" aria-label="New debate">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
            </button>
          </div>

          <div class="sidebar-search">
            <input type="search" id="sidebar-search" placeholder="Search debates…" autocomplete="off" aria-label="Search debates" />
          </div>

          <div class="sidebar-list" id="sidebar-list"></div>
        </div>
      </aside>

      <div class="sidebar-overlay" id="sidebar-overlay" style="display:none"></div>

      <button class="mobile-toggle" id="mobile-toggle" aria-label="Open sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="4" y1="6" x2="20" y2="6"/>
          <line x1="4" y1="12" x2="20" y2="12"/>
          <line x1="4" y1="18" x2="20" y2="18"/>
        </svg>
      </button>

      <!-- Main content -->
      <div class="app-container" id="app-container">

        <!-- Empty state -->
        <div class="empty-state" id="empty-state">
          <div class="empty-state-inner">
            <div class="empty-logo">
              <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                <rect x="4" y="8" width="18" height="32" rx="4" fill="oklch(72% 0.16 52 / 0.2)" stroke="oklch(72% 0.16 52 / 0.6)" stroke-width="1.5"/>
                <rect x="26" y="8" width="18" height="32" rx="4" fill="oklch(68% 0.14 220 / 0.2)" stroke="oklch(68% 0.14 220 / 0.6)" stroke-width="1.5"/>
                <line x1="24" y1="8" x2="24" y2="40" stroke="oklch(58% 0.01 250 / 0.4)" stroke-width="1" stroke-dasharray="3 3"/>
              </svg>
            </div>
            <h1 class="empty-title">DebateItOut</h1>
            <p class="empty-sub">Set a proposition. Pick your factions. Let the models argue.</p>
            <button class="btn-primary" id="empty-new-btn">New Debate</button>
          </div>
        </div>

        <!-- Active debate view (hidden until a debate is loaded) -->
        <div class="debate-view" id="debate-view" style="display:none">

          <!-- Proposition header -->
          <div class="debate-header" id="debate-header">
            <div class="debate-header-left">
              <span class="debate-round-indicator" id="debate-round-indicator">ROUND 1 / 6</span>
            </div>
            <div class="debate-proposition" id="debate-proposition"></div>
            <div class="debate-header-right">
              <button class="btn-ghost-sm" id="export-btn">Export</button>
              <button class="header-action-btn header-rename-btn" id="header-rename-btn" title="Rename debate" aria-label="Rename debate">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
                </svg>
              </button>
            </div>
          </div>


          <!-- Faction columns -->
          <div class="debate-area" id="debate-area">
            <svg id="connector-overlay" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index: 10;"></svg>
            <div class="faction-column faction-a" id="faction-a-col">
              <div class="faction-header">
                <span class="faction-label faction-a-label">Faction A</span>
                <span class="faction-stance" id="faction-a-stance"></span>
              </div>
              <div class="faction-models" id="faction-a-models"></div>
              <div class="faction-turns" id="faction-a-turns"></div>
            </div>

            <div class="faction-column faction-b" id="faction-b-col">
              <div class="faction-header">
                <span class="faction-label faction-b-label">Faction B</span>
                <span class="faction-stance" id="faction-b-stance"></span>
              </div>
              <div class="faction-models" id="faction-b-models"></div>
              <div class="faction-turns" id="faction-b-turns"></div>
            </div>
          </div>

          <!-- Control bar -->
          <div class="control-bar" id="control-bar">
            <div class="moderator-log-inline" id="moderator-log-inner"></div>
            <button class="advance-btn" id="advance-btn">Advance Turn</button>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Create debate modal -->
  <div class="modal-overlay" id="create-modal" style="display:none" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">New Debate</h2>
        <button class="modal-close" id="modal-close" aria-label="Close modal">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="proposition-input">Proposition</label>
          <textarea class="form-textarea" id="proposition-input" rows="3" placeholder="e.g. AI will replace most knowledge work within 10 years" maxlength="2000"></textarea>
        </div>

        <div class="faction-builder-row">
          <!-- Faction A -->
          <div class="faction-builder faction-a-builder">
            <div class="faction-builder-header">
              <span class="faction-label faction-a-label">Faction A</span>
            </div>
            <div class="form-group">
              <label class="form-label" for="faction-a-stance-input">Stance</label>
              <input class="form-input" id="faction-a-stance-input" type="text" placeholder="for" value="for" />
            </div>
            <div class="form-group">
              <span class="form-label" id="faction-a-models-label">Models</span>
              <div class="model-picker" id="faction-a-picker" data-faction="A" aria-labelledby="faction-a-models-label"></div>
            </div>
          </div>

          <div class="vs-divider">VS</div>

          <!-- Faction B -->
          <div class="faction-builder faction-b-builder">
            <div class="faction-builder-header">
              <span class="faction-label faction-b-label">Faction B</span>
            </div>
            <div class="form-group">
              <label class="form-label" for="faction-b-stance-input">Stance</label>
              <input class="form-input" id="faction-b-stance-input" type="text" placeholder="against" value="against" />
            </div>
            <div class="form-group">
              <span class="form-label" id="faction-b-models-label">Models</span>
              <div class="model-picker" id="faction-b-picker" data-faction="B" aria-labelledby="faction-b-models-label"></div>
            </div>
          </div>
        </div>

        <div class="form-group form-group-inline">
          <label class="form-label" for="max-rounds-input">Rounds</label>
          <input class="form-input form-input-sm" id="max-rounds-input" type="number" min="1" max="20" value="6" />
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-ghost" id="modal-cancel">Cancel</button>
        <button class="btn-primary" id="modal-submit">Start Debate</button>
      </div>
    </div>
  </div>

  <!-- Inline rename modal -->
  <div class="modal-overlay" id="rename-modal" style="display:none" role="dialog" aria-modal="true" aria-labelledby="rename-title">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2 class="modal-title" id="rename-title">Rename Debate</h2>
        <button class="modal-close" id="rename-modal-close" aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <input class="form-input" id="rename-input" type="text" placeholder="Custom name…" aria-label="Custom name" />
      </div>
      <div class="modal-footer">
        <button class="btn-ghost" id="rename-cancel">Cancel</button>
        <button class="btn-primary" id="rename-submit">Save</button>
      </div>
    </div>
  </div>

  <!-- Export modal -->
  <div class="modal-overlay" id="export-modal" style="display:none" role="dialog" aria-modal="true" aria-labelledby="export-title">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2 class="modal-title" id="export-title">Export Debate</h2>
        <button class="modal-close" id="export-modal-close" aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group" style="margin-bottom: 0.5rem;">
          <span class="form-label">Include private data:</span>
          <label class="form-label" style="display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; margin-bottom: 0.5rem; font-weight: normal; cursor: pointer;">
            <input type="checkbox" id="export-inc-thinking" checked style="cursor: pointer;" /> Thinking
          </label>
          <label class="form-label" style="display: flex; align-items: center; gap: 0.5rem; font-weight: normal; cursor: pointer;">
            <input type="checkbox" id="export-inc-team-msg" checked style="cursor: pointer;" /> Team Messages
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-ghost" id="export-md-confirm">Download MD</button>
        <button class="btn-primary" id="export-json-confirm">Download JSON</button>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
