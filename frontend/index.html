<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PromptCouncil</title>
  <meta name="description" content="PromptCouncil — self-hosted multi-model AI chat. Talk to Claude, GPT, Gemini, and local Ollama models from one interface." />
  <meta property="og:title" content="PromptCouncil" />
  <meta property="og:description" content="Self-hosted multi-model AI chat interface." />

  <script src="https://cdn.jsdelivr.net/npm/marked@13/marked.min.js"></script>

  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div id="app">
    <div class="app-layout">

      <aside class="sidebar" id="sidebar">
        <div class="sidebar-inner">
          <div class="sidebar-header">
            <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle sidebar">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="3"/>
                <line x1="9" y1="3" x2="9" y2="21"/>
              </svg>
            </button>
            <span class="sidebar-title">Chats</span>
            <button class="new-chat-btn" id="new-chat-btn" title="New chat (Ctrl+N)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
            </button>
          </div>

          <div class="sidebar-search">
            <input type="search" id="sidebar-search" placeholder="Search chats..." autocomplete="off" />
          </div>

          <div class="sidebar-list" id="sidebar-list"></div>
        </div>
      </aside>

      <div class="sidebar-overlay" id="sidebar-overlay" style="display:none"></div>

      <button class="mobile-toggle" id="mobile-toggle" aria-label="Open sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="4" y1="6" x2="20" y2="6"/>
          <line x1="4" y1="12" x2="20" y2="12"/>
          <line x1="4" y1="18" x2="20" y2="18"/>
        </svg>
      </button>

      <div class="app-container">

        <div class="chat-header">
          <span class="chat-header-title" id="chat-header-title" title="Double-click to rename">
            PromptCouncil
          </span>
          <input class="header-rename-input" id="header-rename-input" style="display:none" autocomplete="off" />
          <button class="export-btn" id="export-btn" style="display:none" title="Export conversation as Markdown">
            Export
          </button>
        </div>

        <div class="chat-box" id="chat-box">

        </div>

        <div class="input-container">
          <div class="input-top-row">
            <div class="model-selector" id="model-selector">

            </div>
          </div>
          <div class="input-wrapper">
            <textarea
              class="input-field"
              id="input-field"
              rows="1"
              placeholder="Select a model first..."
              autocomplete="off"
            ></textarea>
            <button class="send-button" id="send-button" disabled>
              <svg class="send-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
              </svg>
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
